AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Bin Day Alexa skill

Parameters:
  AlexaSkillId:
    Type: String
    Description: Alexa skill ID allowed to invoke the Lambda function
    AllowedPattern: "^amzn1\\.ask\\.skill\\.[A-Za-z0-9-]+$"

Resources:
  BinDayExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: bin-day-lambda-execution
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  BinDayFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: bin-day
      Description: Alexa handler for the Bin Day skill
      CodeUri: build/
      Handler: lambda_function.lambda_handler
      Runtime: python3.13
      Role: !GetAtt BinDayExecutionRole.Arn
      Architectures:
        - x86_64
      MemorySize: 1024
      Timeout: 30
      Events:
        AlexaSkill:
          Type: AlexaSkill
          Properties:
            SkillId: !Ref AlexaSkillId

Outputs:
  FunctionArn:
    Description: Use this ARN as the Alexa skill's default endpoint.
    Value: !GetAtt BinDayFunction.Arn
